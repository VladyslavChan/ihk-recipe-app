<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Recipe Book{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="logo" href="{{ url_for('index') }}">🍳 Recipe Book</a>
    <form action="{{ url_for('index') }}" method="get">
      <input type="search" name="q" value="{{ q or '' }}" placeholder="Search recipes, ingredients, categories…">
      <button type="submit">Search</button>
    </form>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Recipe Book · Flask + PostgreSQL · monitored with Prometheus &amp; Grafana</footer>
</body>
</html>
